<body>
<div class="stage">

  <div class="stagebar">
    <span class="dot" id="dot"></span>
    <strong id="title" class="big">Spark Live</strong>
    <div class="spacer"></div>
    <div class="langsel" id="langsel"></div>
    <div class="uisel" id="uiSwitch"></div>
    <button class="iconbtn" id="srcBtn" data-i18n="srcBtn">Source</button>
    <button class="iconbtn" id="smaller" aria-label="Smaller text">A−</button>
    <button class="iconbtn" id="bigger" aria-label="Larger text">A+</button>
    
    <button class="iconbtn" id="fsBtn">⛶</button>
  </div>

  <div class="feed" id="feed">
    <div class="empty" id="empty">Connecting…<br /><span class="sub">در حال اتصال…</span></div>
  </div>

  <footer class="stagefoot">
    <span>Spark Live</span>
    <span class="sep">·</span>
    <span><span data-i18n="footAsk">Questions or feedback? Contact Paul</span>
      <a href="mailto:paul.sy.liu@gmail.com">paul.sy.liu@gmail.com</a></span>
  </footer>

</div>

<script type="module" src="/viewer.js"></script>
