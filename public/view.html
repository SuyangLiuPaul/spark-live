<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f17" />
<title>Spark Live · ترجمه زنده</title>
<meta name="description" content="Live translation — دری · English · 中文" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Spark Live" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/favicon-32.png" sizes="32x32" />
<link rel="icon" href="/icons/icon-192.png" sizes="192x192" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta property="og:title" content="ترجمه زنده · Live translation" />
<meta property="og:description" content="دری · English · 中文" />
<meta property="og:image" content="/og-card.png" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="/styles.css?v=15" />
</head>
<body>
<div class="stage">

  <!-- An audience member does exactly one thing often: choose the language they
       read. That stays in the bar; everything else is set once, so it moves into
       a labelled menu instead of competing for space and attention. -->
  <div class="stagebar">
    <span class="dot" id="dot"></span>
    <strong id="title" class="big">Spark Live</strong>
    <div class="langsel" id="langsel" role="group" aria-label="Reading language"></div>
    <div class="menuwrap">
      <button class="iconbtn menubtn" id="menuBtn" aria-haspopup="true"
              aria-expanded="false" aria-controls="menu" data-i18n-al="menuLabel"
              aria-label="Display options">⋯</button>
      <div class="menu" id="menu" role="menu" hidden>
        <button class="menuitem" role="menuitemcheckbox" id="srcBtn" aria-checked="true">
          <span data-i18n="menuSource">Show original text</span>
          <span class="tick" aria-hidden="true">✓</span>
        </button>
        <div class="menuitem static">
          <span data-i18n="menuTextSize">Text size</span>
          <span class="sizectl">
            <button id="smaller" data-i18n-al="smallerLabel" aria-label="Smaller text">A−</button>
            <b id="sizeVal">32</b>
            <button id="bigger" data-i18n-al="biggerLabel" aria-label="Larger text">A+</button>
          </span>
        </div>
        <div class="menuitem static">
          <span data-i18n="menuInterface">App language</span>
          <div class="uisel" id="uiSwitch"></div>
        </div>
        <button class="menuitem" role="menuitem" id="fsBtn">
          <span data-i18n="menuFullscreen">Full screen</span>
        </button>
      </div>
    </div>
  </div>

  <div class="feed" id="feed">
    <div class="empty" id="empty">Connecting…<br /><span class="sub">در حال اتصال…</span></div>
  </div>

  <footer class="stagefoot">
    <span>Spark Live</span>
    <span class="sep">·</span>
    <span><span data-i18n="footAsk">Questions or feedback? Contact Paul</span>
      <a href="mailto:paul.sy.liu@gmail.com">paul.sy.liu@gmail.com</a></span>
  </footer>

</div>

<script type="module" src="/viewer.js"></script>
</body>
</html>
