# Spark Live — deploy on push.
#
# This exists because production once served a bundle five commits behind dev,
# for weeks, with nothing anywhere reporting it. The fix was committed, dev was
# redeployed, prod was not, and the gap only surfaced when someone stood in
# front of a room and it did not work.
#
# So the gate is the smoke suite, and prod is only reached through it: dev is
# deployed first and must pass against real backends before production is
# touched. A failure after the prod deploy still fails the run loudly.
#
# Requires one repository secret: NETLIFY_AUTH_TOKEN.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two overlapping pushes must not race each other onto the same site.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # netlify-cli's dependencies declare node >=22.12; on 20 the install
          # is a wall of EBADENGINE warnings waiting to become a hard failure.
          node-version: 22

      # Belt and braces: deploy.sh scans the publish tree, but a credential
      # committed anywhere in the repo should fail before we reach a deploy.
      - name: Scan the repository for credentials
        run: |
          if grep -rIlE 'gsk_[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{30,}|re_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}' \
               --exclude-dir=.git --exclude-dir=node_modules .; then
            echo "::error::a credential is committed in the files above"
            exit 1
          fi
          echo "no credentials in the repository"

      # netlify-cli takes ~45 s to install before it can tell you the token is
      # missing, and then only says "Unauthorized: could not retrieve project",
      # which reads like a permissions problem on the site rather than an empty
      # secret. Check it up front. Printing the length is safe and is the only
      # way to distinguish "not set" from "set to something wrong".
      - name: Check the Netlify token is present
        run: |
          n=${#NETLIFY_AUTH_TOKEN}
          if [ "$n" -eq 0 ]; then
            echo "::error::NETLIFY_AUTH_TOKEN is empty. Set it with: gh secret set NETLIFY_AUTH_TOKEN --repo SuyangLiuPaul/spark-live"
            exit 1
          fi
          echo "token present ($n characters)"

      - run: npm ci || npm install

      - name: Deploy dev
        run: ./deploy.sh dev "ci ${{ github.sha }}"

      # The real gate. Runs the shipped engine against dev's live backends.
      - name: Smoke test dev
        run: node tools/smoke.mjs https://spark-live-dev.netlify.app

      - name: Deploy prod
        run: ./deploy.sh prod "ci ${{ github.sha }}"

      - name: Smoke test prod
        run: node tools/smoke.mjs https://spark-live-translate.netlify.app
